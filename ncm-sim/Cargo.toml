[package]
name = "ncm-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
clap = { version = "4.6.8", features = ["derive"] }
rand = "0.8"

[features]
# GPU backends (optional). Build with e.g. `cargo build --release --features cuda`.
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
